
# Docker Compose configuration for the image-generation application.
# Backend: FastAPI
# Frontend: Streamlit

services:

  # FastAPI backend application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: sdc-backend:compose

    ports:
      - "8000:8000"

    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY:?OPENAI_API_KEY is missing}"
      STABILITY_KEY: "${STABILITY_KEY:?STABILITY_KEY is missing}"
      PROFANITY_PROMPT_FILE: /app/profanity_prompt.txt
      UPLOAD_FOLDER: /app/images
      REDIS_URL: redis://redis:6379/0
    
    volumes:
      - generated_images:/app/images

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Streamlit frontend application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: sdc-frontend:compose

    ports:
      - "8501:8501"

    environment:
      API_URL: http://backend:8000

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  # Redis queue for asynchronous image generation (v3)
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # RQ worker that processes image-generation jobs
  worker:
    image: sdc-backend:compose
    command: ["python", "worker.py"]

    environment:
      STABILITY_KEY: "${STABILITY_KEY:?STABILITY_KEY is missing}"
      REDIS_URL: redis://redis:6379/0
      UPLOAD_FOLDER: /app/images

    volumes:
      - generated_images:/app/images

    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
  
volumes:
  generated_images:
  redis_data:



